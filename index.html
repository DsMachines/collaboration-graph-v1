<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Course - Knowledge Graph</title>
    <script src="https://unpkg.com/vis-network@9/standalone/umd/vis-network.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0f1e; color: #e2e8f0; height: 100vh; overflow: hidden; }
        
        .app {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 80px 1fr;
            height: 100vh;
            transition: grid-template-columns 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app.sidebar-collapsed { grid-template-columns: 0px 1fr; }

        .topbar {
            grid-column: 1 / -1;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(100, 116, 139, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px 0 24px;
            gap: 16px;
            z-index: 10;
        }
        .topbar-title {
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            background: linear-gradient(135deg, #ef4444, #3b82f6, #22c55e);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar-controls { display: flex; gap: 8px; align-items: center; }
        .topbar-controls input {
            background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(100, 116, 139, 0.3);
            color: #e2e8f0; padding: 6px 14px; border-radius: 8px; outline: none; width: 180px;
        }
        .btn {
            background: rgba(100, 116, 139, 0.2); border: 1px solid rgba(100, 116, 139, 0.3);
            color: #94a3b8; padding: 6px 14px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: rgba(100, 116, 139, 0.35); color: #e2e8f0; }
        .btn.active { color: #f59e0b; border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .btn.cluster-btn { color: #c084fc; border-color: rgba(168, 85, 247, 0.4); }

        .sidebar {
            background: rgba(15, 23, 42, 0.9); border-right: 1px solid rgba(100, 116, 139, 0.15);
            overflow-y: auto; padding: 16px; transition: all 0.4s ease; width: 280px; opacity: 1;
        }
        .sidebar-collapsed .sidebar { width: 0; opacity: 0; padding: 0; pointer-events: none; border: none; }
        .sidebar h3 { font-size: 0.7rem; text-transform: uppercase; color: #64748b; margin: 15px 0 10px; border-bottom: 1px solid rgba(100, 116, 139, 0.1); padding-bottom: 5px; }
        .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.8rem; color: #94a3b8; cursor: pointer; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        .info-panel { margin-top: 20px; padding: 15px; background: rgba(30, 41, 59, 0.5); border-radius: 12px; display: none; }
        .info-panel.visible { display: block; }

        #graph-container { position: relative; background: #0f172a; overflow: hidden; }
        #network-canvas { width: 100%; height: 100%; position: absolute; }
        
        .stats-bar { position: absolute; top: 15px; right: 20px; display: flex; gap: 10px; }
        .stat-badge { background: rgba(15, 23, 42, 0.6); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: #64748b; border: 1px solid rgba(100,116,139,0.2); }
    </style>
</head>
<body>
    <div class="app">
        <div class="topbar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
                <div class="topbar-title">Collaboration Course - Knowledge Graph</div>
            </div>
            <div class="topbar-controls">
                <input type="text" id="search-input" placeholder="Search..." oninput="searchNodes(this.value)">
                <button class="btn active" onclick="filterBy('all', this)">All</button>
                <button class="btn" onclick="filterBy('A', this)">Book A</button>
                <button class="btn" onclick="filterBy('B', this)">Book B</button>
                <button class="btn" onclick="filterBy('C', this)">Book C</button>
                <button class="btn cluster-btn" id="cluster-toggle" onclick="toggleClustering()">Cluster by Book</button>
                <button class="btn" onclick="network.fit({animation:true})">Fit</button>
            </div>
        </div>

        <div class="sidebar">
            <h3>Books</h3>
            <div class="legend-item" onclick="filterBy('A',null)"><div class="legend-dot" style="background:#ef4444"></div> Book A</div>
            <div class="legend-item" onclick="filterBy('B',null)"><div class="legend-dot" style="background:#3b82f6"></div> Book B</div>
            <div class="legend-item" onclick="filterBy('C',null)"><div class="legend-dot" style="background:#22c55e"></div> Book C</div>
            <div class="legend-item" onclick="filterBy('cross',null)"><div class="legend-dot" style="background:#f59e0b"></div> Cross-links</div>
            
            <div class="info-panel" id="info-panel">
                <h4 id="info-title" style="margin-bottom:8px"></h4>
                <p id="info-meta" style="font-size:0.75rem; color:#64748b; margin-bottom:10px"></p>
                <p id="info-desc" style="font-size:0.85rem; line-height:1.5"></p>
                <div id="info-connections" style="margin-top:15px; font-size:0.8rem; color:#f59e0b"></div>
            </div>
        </div>

        <div id="graph-container">
            <div id="network-canvas"></div>
            <div class="stats-bar">
                <div class="stat-badge"><strong id="stat-nodes">61</strong> nodes</div>
                <div class="stat-badge"><strong id="stat-edges">76</strong> links</div>
            </div>
        </div>
    </div>

    <script>
        const nodes = [
            { id: "enemyfying", label: "Enemyfying", cat: "mindset", book: "A", ch: "Ch 7", desc: "Tendency to see others as enemies." },
            { id: "stretch_collab", label: "Stretch\nCollaboration", cat: "principle", book: "A", ch: "Ch 4", desc: "Working with people you don't agree with." },
            { id: "power_vs_love", label: "Power vs Love", cat: "principle", book: "A", ch: "Ch 5", desc: "Balancing two fundamental drives." },
            { id: "exit_adapt_force", label: "Exit / Adapt\n/ Force", cat: "mindset", book: "A", ch: "Ch 2", desc: "Three conventional responses to conflict." },
            { id: "scapegoating", label: "Scapegoating", cat: "mindset", book: "A", ch: "Ch 7", desc: "Projecting blame onto others." },
            { id: "asserting_engaging", label: "Asserting &\nEngaging", cat: "tool", book: "A", ch: "Ch 5", desc: "Expressing power while engaging others." },
            { id: "downloading_a", label: "Downloading", cat: "process_step", book: "A", ch: "Intro", desc: "Listening from habit." },
            { id: "debating", label: "Debating", cat: "process_step", book: "A", ch: "Intro", desc: "Listening to find differences." },
            { id: "dialoguing_a", label: "Dialoguing", cat: "process_step", book: "A", ch: "Intro", desc: "Empathic listening." },
            { id: "presencing_a", label: "Presencing", cat: "process_step", book: "A", ch: "Intro", desc: "Generative listening." },
            { id: "holon", label: "Holon", cat: "principle", book: "A", ch: "Ch 5", desc: "Being both a part and a whole." },
            { id: "step_into_game", label: "Step Into\nthe Game", cat: "principle", book: "A", ch: "Ch 7", desc: "Taking responsibility." },
            { id: "experimentation_a", label: "Experimentation", cat: "process_step", book: "A", ch: "Ch 6", desc: "Trial and error progress." },
            { id: "week_program", label: "6-Week Program", cat: "exercise", book: "A", ch: "End", desc: "Practice program." },

            // Book B
            { id: "transformative_facilitation", label: "Transformative\nFacilitation", cat: "principle", book: "B", ch: "Core", desc: "Facilitation that removes obstacles." },
            { id: "removing_obstacles", label: "Removing\nObstacles", cat: "principle", book: "B", ch: "Core", desc: "Removing what blocks a group." },
            { id: "contribution", label: "Contribution", cat: "principle", book: "B", ch: "Core", desc: "Bringing skills and resources." },
            { id: "connection", label: "Connection", cat: "principle", book: "B", ch: "Core", desc: "Knowing each other as peers." },
            { id: "equity", label: "Equity", cat: "principle", book: "B", ch: "Core", desc: "Inclusivity and fairness." },
            { id: "vertical_facilitation", label: "Vertical", cat: "tool", book: "B", ch: "Ch 2", desc: "Conventional directing." },
            { id: "horizontal_facilitation", label: "Horizontal", cat: "tool", book: "B", ch: "Ch 2", desc: "Conventional accompanying." },
            { id: "ten_moves", label: "Ten Moves", cat: "tool", book: "B", ch: "Ch 4", desc: "Five pairs of outer moves." },
            { id: "advocating_inquiring", label: "Advocating &\nInquiring", cat: "tool", book: "B", ch: "Ch 6", desc: "Balancing stating and asking." },
            { id: "concluding_advancing", label: "Concluding &\nAdvancing", cat: "tool", book: "B", ch: "Ch 7", desc: "Balancing closure and progress." },
            { id: "mapping_discovering", label: "Mapping &\nDiscovering", cat: "tool", book: "B", ch: "Ch 8", desc: "Balancing planning and finding." },
            { id: "directing_accompanying", label: "Directing &\nAccompanying", cat: "tool", book: "B", ch: "Ch 9", desc: "Balancing control and support." },
            { id: "outside_inside", label: "Outside/Inside", cat: "tool", book: "B", ch: "Ch 10", desc: "Balancing perspective and involvement." },
            { id: "diverging_emerging_converging", label: "Diverge/Emerge\n/Converge", cat: "process_step", book: "B", ch: "Ch 7", desc: "Creative process phases." },
            { id: "negative_capability", label: "Negative\nCapability", cat: "mindset", book: "B", ch: "Ch 7", desc: "Staying in uncertainty." },
            { id: "power_love_justice", label: "Power, Love\n& Justice", cat: "principle", book: "B", ch: "End", desc: "Structural drives." },
            { id: "incompleteness", label: "Incompleteness", cat: "mindset", book: "B", ch: "Core", desc: "Starting imperfect." },
            { id: "imperfection", label: "Imperfection", cat: "mindset", book: "B", ch: "Core", desc: "Working with what you have." },
            { id: "social_labs", label: "Social Labs", cat: "tool", book: "B", ch: "Method", desc: "Multi-stakeholder platforms." },
            { id: "scenario_planning", label: "Scenario\nPlanning", cat: "tool", book: "B", ch: "Method", desc: "Preparing for futures." },
            { id: "dissent_as_fuel", label: "Dissent as Fuel", cat: "principle", book: "B", ch: "Method", desc: "Conflict as a resource." },

            // Book C
            { id: "theory_u", label: "Theory U", cat: "principle", book: "C", ch: "M1", desc: "Learning from the future." },
            { id: "iceberg_model", label: "Iceberg", cat: "principle", book: "C", ch: "M1", desc: "Root causes framework." },
            { id: "downloading_c", label: "Downloading", cat: "process_step", book: "C", ch: "M1", desc: "Habitual listening." },
            { id: "seeing", label: "Seeing", cat: "process_step", book: "C", ch: "M1", desc: "Factual listening." },
            { id: "sensing", label: "Sensing", cat: "process_step", book: "C", ch: "M2", desc: "Empathic listening." },
            { id: "presencing_c", label: "Presencing", cat: "process_step", book: "C", ch: "M3", desc: "Generative listening." },
            { id: "crystallizing", label: "Crystallizing", cat: "process_step", book: "C", ch: "M3", desc: "Vision from source." },
            { id: "prototyping_c", label: "Prototyping", cat: "process_step", book: "C", ch: "M4", desc: "Testing the future." },
            { id: "co_evolving", label: "Co-Evolving", cat: "process_step", book: "C", ch: "M5", desc: "Iterating the ecosystem." },
            { id: "co_initiating", label: "Co-Initiating", cat: "process_step", book: "C", ch: "M1", desc: "Common intention." },
            { id: "co_sensing", label: "Co-Sensing", cat: "process_step", book: "C", ch: "M2", desc: "Learning together." },
            { id: "co_creating", label: "Co-Creating", cat: "process_step", book: "C", ch: "M4", desc: "Prototyping together." },
            { id: "absencing", label: "Absencing", cat: "mindset", book: "C", ch: "M3", desc: "Inverse of Presencing." },
            { id: "voj", label: "Voice of\nJudgment", cat: "mindset", book: "C", ch: "M1", desc: "Blocks seeing." },
            { id: "voc", label: "Voice of\nCynicism", cat: "mindset", book: "C", ch: "M2", desc: "Blocks sensing." },
            { id: "vof", label: "Voice of\nFear", cat: "mindset", book: "C", ch: "M3", desc: "Blocks open will." },
            { id: "four_listening", label: "4 Levels of\nListening", cat: "tool", book: "C", ch: "M1", desc: "Evolution of listening." },
            { id: "case_clinic", label: "Case Clinic", cat: "tool", book: "C", ch: "M1", desc: "Peer coaching." },
            { id: "empathy_walk", label: "Empathy Walk", cat: "tool", book: "C", ch: "M1", desc: "Immersive empathy." },
            { id: "sensing_journey", label: "Sensing Journey", cat: "tool", book: "C", ch: "M2", desc: "Edge system visits." },
            { id: "stakeholder_int", label: "Stakeholder\nInterviews", cat: "tool", book: "C", ch: "M2", desc: "Seeing from outside." },
            { id: "spt", label: "Social\nPresencing", cat: "tool", book: "C", ch: "M2", desc: "Body awareness theater." },
            { id: "three_d_mapping", label: "3D Mapping", cat: "tool", book: "C", ch: "M4", desc: "System modeling." },
            { id: "journaling", label: "Journaling", cat: "tool", book: "C", ch: "M3", desc: "Reflective practice." },
            { id: "ego_to_eco", label: "Ego to Eco", cat: "principle", book: "C", ch: "M1", desc: "Shift in awareness." },
            { id: "distractions", label: "4 Distractions", cat: "mindset", book: "C", ch: "M5", desc: "Losing presence factors." },
        ];

        const edges = [
            { from: "enemyfying", to: "scapegoating" }, { from: "enemyfying", to: "step_into_game" },
            { from: "power_vs_love", to: "asserting_engaging" }, { from: "downloading_a", to: "debating" },
            { from: "debating", to: "dialoguing_a" }, { from: "dialoguing_a", to: "presencing_a" },
            { from: "transformative_facilitation", to: "removing_obstacles" },
            { from: "removing_obstacles", to: "contribution" }, { from: "removing_obstacles", to: "connection" },
            { from: "ten_moves", to: "advocating_inquiring" }, { from: "ten_moves", to: "concluding_advancing" },
            { from: "theory_u", to: "downloading_c" }, { from: "seeing", to: "sensing" },
            { from: "sensing", to: "presencing_c" }, { from: "voj", to: "seeing" },
            { from: "voc", to: "sensing" }, { from: "vof", to: "presencing_c" },
            // Cross-links (orange)
            { from: "enemyfying", to: "absencing", color: "#f59e0b", width: 2 },
            { from: "presencing_a", to: "presencing_c", color: "#f59e0b", width: 2 },
            { from: "social_labs", to: "co_creating", color: "#f59e0b", width: 2 },
            { from: "removing_obstacles", to: "theory_u", color: "#f59e0b", width: 2 },
        ];

        const visNodes = new vis.DataSet(nodes.map(n => ({
            id: n.id, label: n.label, shape: 'dot', size: 20, 
            color: { background: n.book === 'A' ? '#ef4444' : n.book === 'B' ? '#3b82f6' : '#22c55e', border: '#0f172a' },
            font: { color: '#e2e8f0', size: 14, strokeWidth: 3, strokeColor: '#0f172a' },
            _book: n.book, _desc: n.desc, _orig: n.label, _meta: n.ch
        })));

        const visEdges = new vis.DataSet(edges.map(e => ({
            from: e.from, to: e.to, color: e.color || '#475569', width: e.width || 1, arrows: 'to'
        })));

        const container = document.getElementById('network-canvas');
        const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
            physics: { barnesHut: { gravitationalConstant: -10000, springLength: 150, damping: 0.3 }, stabilization: { iterations: 150 } },
            interaction: { hover: true, tooltipDelay: 100 }
        });

        network.on('stabilized', () => network.setOptions({ physics: { enabled: false } }));
        network.on('click', (p) => {
            if (p.nodes.length) {
                const n = visNodes.get(p.nodes[0]);
                document.getElementById('info-title').innerText = n._orig;
                document.getElementById('info-desc').innerText = n._desc;
                document.getElementById('info-meta').innerText = n._meta;
                document.getElementById('info-panel').classList.add('visible');
            } else {
                document.getElementById('info-panel').classList.remove('visible');
            }
        });

        function toggleSidebar() { document.querySelector('.app').classList.toggle('sidebar-collapsed'); setTimeout(() => network.redraw(), 500); }
        function filterBy(book, btn) {
            network.setOptions({ physics: { enabled: true } });
            visNodes.forEach(n => {
                visNodes.update({ id: n.id, hidden: book !== 'all' && n._book !== book });
            });
            if(btn) { document.querySelectorAll('.topbar-controls .btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        }
        function searchNodes(q) {
            q = q.toLowerCase();
            visNodes.forEach(n => {
                const match = n._orig.toLowerCase().includes(q) || n._desc.toLowerCase().includes(q);
                visNodes.update({ id: n.id, opacity: q ? (match ? 1 : 0.1) : 1 });
            });
        }
        let isClustered = false;
        function toggleClustering() {
            if (!isClustered) {
                ['A', 'B', 'C'].forEach(b => network.cluster({
                    joinCondition: (n) => n._book === b,
                    clusterNodeProperties: { label: b + ' Book', size: 40, color: '#f59e0b' }
                }));
            } else {
                ['A', 'B', 'C'].forEach(b => { try { network.openCluster(b + ' Book'); } catch(e){} });
            }
            isClustered = !isClustered;
        }
    </script>
</body>
</html>
